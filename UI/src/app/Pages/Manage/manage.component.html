<table *ngIf="!viewEntry" mat-table [dataSource]="tableData">
    <ng-container matColumnDef="createdDate">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let element"> {{element.createdDate}} </td>
    </ng-container>

    <ng-container matColumnDef="birdName">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.birdName}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" style="cursor: pointer;" (click)="onLineItemClick(row)"></tr>
</table>

<div *ngIf="viewEntry">
    <audio *ngIf="audioURL" controls="">
        <source [src]="sanitize(audioURL)" type="audio/wav">
    </audio>
    <div *ngIf="activePrediction.length > 0">
        <mat-card *ngFor="let bird of activePrediction" class="example-card" appearance="outlined" style="cursor: pointer; margin: 10px;">
          <mat-card-header>
            <mat-card-title>{{bird!.common_name}}</mat-card-title>
            <mat-card-subtitle>{{bird!.scientific_name}}</mat-card-subtitle>
          </mat-card-header>
          <img mat-card-image src={{bird!.imageURL}}>
          <mat-card-content>
            <p>
              {{bird!.description}}
            </p>
          </mat-card-content>
        </mat-card>
      </div>
</div>
